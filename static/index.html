<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MY PLAYLIST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="desk">
    <section class="player window" aria-label="Main player">
      <header class="titlebar">
        <h1 class="brand">MY PLAYLIST</h1>
        <div class="titlebar-right">
          <button type="button" class="win-btn" id="winMinBtn" title="Toggle form panels">_</button>
          <button type="button" class="win-btn" id="winFocusBtn" title="Focus job list">□</button>
          <button type="button" class="win-btn" id="winReadyBtn" title="Reset status">×</button>
        </div>
      </header>

      <div class="display-row">
        <canvas id="viz" class="viz" width="76" height="32" aria-hidden="true"></canvas>
        <div class="lcd" id="statusLcd" aria-live="polite">
          <span class="lcd-line">1. READY — MP3 320 &lt;0:00&gt;</span>
        </div>
        <div class="lcd-meta" aria-hidden="true">
          <div><strong id="lcdBitrate">320</strong> kbps</div>
          <div><strong>44</strong> kHz</div>
          <div class="stereo">stereo</div>
        </div>
      </div>

      <div class="slider-row" aria-hidden="true">
        <div class="seg-slider vol" title="Volume">
          <div class="seg-fill" style="width: 78%"></div>
        </div>
        <div class="seg-slider bal" title="Balance">
          <div class="seg-fill center" style="width: 50%"></div>
        </div>
      </div>

      <div class="transport">
        <button type="button" class="tr-btn" id="trPrev" title="Previous job">⏮</button>
        <button type="button" class="tr-btn" id="trPlay" title="Focus job list">▶</button>
        <button type="button" class="tr-btn" id="trPause" title="Pause polling display">⏸</button>
        <button type="button" class="tr-btn" id="trStop" title="Reset status to READY">⏹</button>
        <button type="button" class="tr-btn" id="trNext" title="Next job">⏭</button>
        <button type="button" class="tr-btn" id="trEject" title="Open Link mode">⏏</button>
      </div>

      <nav class="mode-bar" role="tablist" aria-label="Modes">
        <button type="button" class="mode-btn active" data-mode="search" role="tab" aria-selected="true">SRCH</button>
        <button type="button" class="mode-btn" data-mode="link" role="tab" aria-selected="false">LINK</button>
        <button type="button" class="mode-btn" data-mode="playlist" role="tab" aria-selected="false">PL</button>
        <button type="button" class="mode-btn" data-mode="settings" role="tab" aria-selected="false">EQ</button>
      </nav>

      <div class="panels">
        <section class="panel active" id="panel-search" role="tabpanel">
          <label class="field-label" for="searchInput">Song - Artist (one per line)</label>
          <textarea id="searchInput" class="well" rows="5" placeholder="Bohemian Rhapsody - Queen&#10;Lose Yourself - Eminem"></textarea>
          <div class="btn-row">
            <button type="button" class="bevel-btn" id="searchBtn">SEARCH</button>
            <button type="button" class="bevel-btn" id="searchDownloadBtn" disabled>DOWNLOAD</button>
          </div>
        </section>

        <section class="panel" id="panel-link" role="tabpanel" hidden>
          <label class="field-label" for="linkInput">YouTube / YouTube Music URL</label>
          <input id="linkInput" class="well input" type="url" placeholder="https://www.youtube.com/watch?v=..." />
          <div class="btn-row">
            <button type="button" class="bevel-btn" id="linkDownloadBtn">DOWNLOAD</button>
          </div>
        </section>

        <section class="panel" id="panel-playlist" role="tabpanel" hidden>
          <label class="field-label" for="playlistInput">Playlist URL (YouTube Music or Spotify)</label>
          <input id="playlistInput" class="well input" type="text" placeholder="https://open.spotify.com/playlist/... or YouTube Music playlist URL" />
          <div class="btn-row">
            <button type="button" class="bevel-btn" id="playlistLoadBtn">LOAD</button>
            <button type="button" class="bevel-btn" id="playlistSelectAllBtn" disabled>SEL ALL</button>
            <button type="button" class="bevel-btn" id="playlistSelectNoneBtn" disabled>SEL NONE</button>
            <button type="button" class="bevel-btn" id="playlistDownloadBtn" disabled>DOWNLOAD</button>
          </div>
        </section>

        <section class="panel" id="panel-settings" role="tabpanel" hidden>
          <div class="settings-grid">
            <label class="field-label" for="setConcurrency">Concurrent downloads</label>
            <input id="setConcurrency" class="well input" type="number" min="1" max="10" />

            <label class="field-label" for="setSearchCount">Search results per song</label>
            <input id="setSearchCount" class="well input" type="number" min="1" max="20" />

            <label class="field-label" for="setFilename">Filename template</label>
            <select id="setFilename" class="well input">
              <option value="Artist - Title">Artist - Title</option>
              <option value="Title">Title only</option>
            </select>

            <label class="field-label" for="setBitrate">Audio bitrate (kbps)</label>
            <input id="setBitrate" class="well input" type="number" min="64" max="320" step="32" />

            <label class="field-label" for="setMusicDir">Music library folder</label>
            <div class="path-row">
              <input id="setMusicDir" class="well input" type="text" placeholder="D:\Music" />
              <button type="button" class="bevel-btn" id="browseMusicDirBtn">BROWSE</button>
            </div>

            <label class="field-label" for="setCookieFile">YouTube cookies.txt</label>
            <div class="path-row">
              <input id="setCookieFile" class="well input" type="text" placeholder="D:\cookies.txt" />
              <button type="button" class="bevel-btn" id="browseCookieBtn">BROWSE</button>
            </div>

            <label class="check-row">
              <input id="setPlaylistSubfolder" type="checkbox" />
              <span>Playlist subfolder</span>
            </label>

            <label class="check-row">
              <input id="setEmbedMetadata" type="checkbox" />
              <span>Embed ID3 metadata</span>
            </label>

            <label class="check-row">
              <input id="setCheckDuplicates" type="checkbox" />
              <span>Warn on duplicates</span>
            </label>
          </div>
          <div class="btn-row">
            <button type="button" class="bevel-btn" id="settingsSaveBtn">SAVE</button>
            <button type="button" class="bevel-btn" id="settingsResetBtn">RESET</button>
          </div>
        </section>
      </div>
    </section>

    <section class="playlist-window window" aria-label="Playlist and jobs">
      <header class="titlebar">
        <h2 class="brand brand-sm">WINAMP PLAYLIST</h2>
        <div class="titlebar-right">
          <button type="button" class="win-btn" id="plWinMinBtn" title="Toggle form panels">_</button>
          <button type="button" class="win-btn" id="plWinFocusBtn" title="Focus job list">□</button>
          <button type="button" class="win-btn" id="plWinReadyBtn" title="Reset status">×</button>
        </div>
      </header>

      <p class="playlist-title" id="playlistTitle" hidden></p>

      <div id="listBody" class="pl-body">
        <div id="searchResults" class="tracklist" hidden></div>
        <div id="playlistResults" class="tracklist" hidden></div>
        <div id="jobsList" class="tracklist jobs">
          <p class="empty-hint">0. — empty list —</p>
        </div>
      </div>

      <footer class="pl-footer">
        <div class="pl-footer-btns">
          <button type="button" class="foot-btn" id="footAdd" title="Search mode">ADD</button>
          <button type="button" class="foot-btn" id="footRem" title="Clear finished/failed jobs">REM</button>
          <button type="button" class="foot-btn" id="footSel" title="Select all playlist tracks">SEL</button>
          <button type="button" class="foot-btn" id="footMisc" title="Settings">MISC</button>
        </div>
        <div class="pl-footer-time" id="plFooterTime">0:00 / 0:00</div>
        <button type="button" class="foot-btn" id="footListOpts" title="Settings">LIST OPTS</button>
      </footer>
    </section>
  </div>

  <div id="dupModal" class="modal" hidden>
    <div class="modal-window window" role="dialog" aria-modal="true" aria-labelledby="dupTitle">
      <header class="titlebar">
        <h2 class="brand brand-sm" id="dupTitle">DUPLICATE CHECK</h2>
      </header>
      <p class="modal-msg">Already in your library:</p>
      <ul id="dupList" class="dup-list well"></ul>
      <div class="btn-row modal-actions">
        <button type="button" class="bevel-btn" id="dupSkipBtn">SKIP DUPES</button>
        <button type="button" class="bevel-btn" id="dupAllBtn">DOWNLOAD ALL</button>
        <button type="button" class="bevel-btn" id="dupCancelBtn">CANCEL</button>
      </div>
    </div>
  </div>

  <div id="fsModal" class="modal" hidden>
    <div class="modal-window window fs-window" role="dialog" aria-modal="true" aria-labelledby="fsTitle">
      <header class="titlebar">
        <h2 class="brand brand-sm" id="fsTitle">SELECT FOLDER</h2>
      </header>
      <p class="modal-msg" id="fsCurrentPath">Drives</p>
      <div id="fsList" class="fs-list well"></div>
      <div class="btn-row modal-actions">
        <button type="button" class="bevel-btn" id="fsUpBtn">UP</button>
        <button type="button" class="bevel-btn" id="fsSelectBtn">SELECT</button>
        <button type="button" class="bevel-btn" id="fsCancelBtn">CANCEL</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
